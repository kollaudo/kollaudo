# Kollaudo and its PostgreSQL database. Start with `docker compose up -d`, then create a project:
#   docker compose exec kollaudo kollaudo-server project create <name>
#
# Set POSTGRES_PASSWORD to a password of your own, and KOLLAUDO_VERSION to pin a release.
services:
  kollaudo:
    image: ghcr.io/kollaudo/kollaudo:${KOLLAUDO_VERSION:-latest}
    environment:
      DATABASE_URL: postgres://kollaudo:${POSTGRES_PASSWORD:-kollaudo}@postgres:5432/kollaudo
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kollaudo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kollaudo}
      POSTGRES_DB: kollaudo
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kollaudo"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:

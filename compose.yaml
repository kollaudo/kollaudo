# Development: `docker compose up -d` starts PostgreSQL for `pnpm dev` and the tests.
# `docker compose --profile app up -d --build` also builds and starts Kollaudo from the sources on
# :8080, as in deploy/docker-compose.yml.
name: kollaudo
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kollaudo
      POSTGRES_PASSWORD: kollaudo
      POSTGRES_DB: kollaudo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kollaudo"]
      interval: 5s
      retries: 10

  kollaudo:
    profiles: [app]
    build: .
    image: kollaudo:dev
    environment:
      DATABASE_URL: postgres://kollaudo:kollaudo@postgres:5432/kollaudo
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

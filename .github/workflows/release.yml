name: Release

# Publishes a release when a tag such as v0.1.0 is pushed. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that the tag is on main and matches the package versions
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main."; exit 1; }
          for file in apps/*/package.json packages/*/package.json e2e/package.json; do
            found=$(node -p "require('./$file').version")
            [[ $found == "$version" ]] ||
              { echo "::error::$file has version $found, not $version."; exit 1; }
          done
          grep -qE "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md ||
            { echo "::error::CHANGELOG.md needs a section \"## [$version] - <release date>\"."; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/kollaudo/kollaudo
          # 0.1.0 and 0.1, and latest for releases that aren't pre-releases such as 0.2.0-rc.1.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

  cli:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing, with provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use caches in release builds
      - run: npm install -g npm@11 # trusted publishing needs npm 11.5.1 or later
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kollaudo/cli build
      - name: Publish @kollaudo/cli
        working-directory: packages/cli
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if npm view "@kollaudo/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@kollaudo/cli $VERSION is already on npm: nothing to publish."
            exit 0
          fi
          # Only what users need: devDependencies point to private workspace packages, such as
          # @kollaudo/schema, and the scripts build from sources that aren't published.
          npm pkg delete devDependencies scripts
          pnpm pack
          tag=$([[ $VERSION == *-* ]] && echo next || echo latest)
          npm publish "kollaudo-cli-$VERSION.tgz" --access public --tag "$tag"

  github-release:
    needs: [check, image, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub release with the changelog section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { on = index($0, "## [" v "]") == 1; next }
            /^\[.*\]: / { next }
            on
          ' CHANGELOG.md >notes.md
          options=(--title "Kollaudo $VERSION" --notes-file notes.md)
          if [[ $VERSION == *-* ]]; then options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${options[@]}"

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kollaudo
          POSTGRES_PASSWORD: kollaudo
          POSTGRES_DB: kollaudo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kollaudo"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://kollaudo:kollaudo@localhost:5432/kollaudo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and start it with PostgreSQL
        run: docker compose --profile app up -d --build --wait
      - name: Check that the API and the UI answer
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: Show the logs
        if: failure()
        run: docker compose --profile app logs

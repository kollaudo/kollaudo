# Weekly updates, grouped to keep the pull requests few. A version is only proposed once it has
# been public for a week: most malicious releases are found and pulled within days, and pnpm also
# refuses packages that are too recent (minimumReleaseAge).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        update-types: [minor, patch]
    ignore:
      # The types must describe the Node we run (.nvmrc), or code could use APIs it doesn't have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The base image of the Dockerfile, and PostgreSQL in the compose files.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The major version of Node follows .nvmrc and "engines", and changes on purpose with the
      # code: Node 25 and later, for example, no longer ship corepack.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
